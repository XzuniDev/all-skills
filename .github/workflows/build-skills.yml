name: Build skills

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-skills.yml"
      - ".github/scripts/build_skills.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-skills

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Rebuild skill folders from the original repos
        run: python .github/scripts/build_skills.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Build skill folders from the original repos"
            git push
          fi
